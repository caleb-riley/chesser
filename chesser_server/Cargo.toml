[package]
name = "chesser_server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
chesser_core = { path = "../chesser_core" }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-native-tls"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "normalize-path"] }




